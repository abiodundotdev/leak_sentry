name: leak_sentry
description: "Finds memory leaks in Flutter apps: disposed objects that something still holds on to, with the path that holds them."
version: 0.0.1
homepage:

environment:
  sdk: ^3.5.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  vm_service: ^15.0.0
  meta: ^1.16.0
  stack_trace: ^1.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

